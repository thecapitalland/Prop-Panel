name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Seed sanitized history metadata
        shell: pwsh
        run: Copy-Item History\meta.example.json History\meta.json

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall dashboard tools

      - name: Run unit tests
        shell: pwsh
        run: |
          Set-Location dashboard
          python -m unittest discover -p "test_*.py" -v